name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pipeline:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: lint
        run: npm run lint

      - name: test
        run: npm test

      - name: build
        run: npm ci

      - name: security-scan
        run: npm audit --audit-level=high
